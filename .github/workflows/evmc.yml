name: EVMC

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build-ewasm:
    name: EWASM State Tests
    runs-on: ubuntu-latest
    steps:

      - name: Set up Go 1.x
        uses: actions/setup-go@v2
        with:
          go-version: ^1.16
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v2

      - name: Install cmake
        run: |
          curl -s https://github.com/Kitware/CMake/releases/download/v3.25.0-rc3/cmake-3.25.0-rc3-linux-x86_64.sh
          chmod +x cmake-3.25.0-rc3-linux-x86_64.sh
          source cmake-3.25.0-rc3-linux-x86_64.sh
          cmake --version

      - name: Get dependencies
        run: |
          go get -v -t -d ./...
          git submodule update --init --recursive
          export GOBIN=${HOME}/go/bin
          mkdir -p "${GOBIN}"
          export PATH="${PATH}:${GOBIN}"
          go install -x golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Test EVMC
        run: |
          make test-evmc
